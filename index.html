<main>
 <header><span>STUNT CAR RACER</span><span class="edition">1989</span><nav><label class="physics-label">PHYSICS <select id="physics" aria-label="Physics version" title="Switching physics restarts the current race" disabled><option value="amiga">AMIGA</option><option value="dos" selected>DOS</option></select></label><button id="graphics" aria-label="Full-resolution 3D" aria-pressed="false" title="Toggle full-resolution 3D (G)">3D: ORIGINAL</button><button id="sound" aria-label="Toggle sound">SOUND ON</button><button id="fullscreen" aria-label="Enter fullscreen">FULLSCREEN</button></nav></header>
